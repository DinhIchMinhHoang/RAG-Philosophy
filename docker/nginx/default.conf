upstream rag_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location = /openapi.json {
        proxy_pass http://rag_backend/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/signup {
        proxy_pass http://rag_backend;
    }

    location = /api/login {
        proxy_pass http://rag_backend;
    }

    location = /api/change-password {
        proxy_pass http://rag_backend;
    }

    location = /api/docs {
        proxy_pass http://rag_backend/docs;
    }

    location = /api/redoc {
        proxy_pass http://rag_backend/redoc;
    }

    location = /api/openapi.json {
        proxy_pass http://rag_backend/openapi.json;
    }

    location = /api/chat/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://rag_backend;
    }

    location ~ ^/api/chat/(.+)$ {
        rewrite ^/api/chat/(.+)$ /chat/$1 break;
        proxy_pass http://rag_backend;
    }

    location ~ ^/api/documents/(upload|sources|reset)$ {
        rewrite ^/api/(documents/(upload|sources|reset))$ /$1 break;
        proxy_pass http://rag_backend;
    }

    location ~ ^/api/documents/(page-image|file)/(.+)$ {
        rewrite ^/api/(documents/(page-image|file)/.+)$ /$1 break;
        proxy_pass http://rag_backend;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://rag_backend;
    }
}
