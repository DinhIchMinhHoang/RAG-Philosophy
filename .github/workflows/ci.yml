name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compile Python
        run: python -m compileall backend rag_core -q

      - name: Run RAG core tests
        run: python -m unittest discover rag_core/tests -v

      - name: Run backend tests
        run: python -m unittest discover backend/tests -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Check docs-only changes
        id: docs_check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          if [[ -z "$CHANGED" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          SKIP=true
          while IFS= read -r f; do
            case "$f" in
              docs/*|README.md|*.md|frontend/*) ;;
              *) SKIP=false; break ;;
            esac
          done <<< "$CHANGED"
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Start backend services
        if: steps.docs_check.outputs.skip != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_db
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          REDIS_BROKER_URL: redis://localhost:6379/0
          REDIS_RESULT_BACKEND: redis://localhost:6379/1
          SYNC_INGEST_WHEN_QUEUE_IDLE: "true"
          OBJECT_STORAGE_BACKEND: local
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" 2>/dev/null; then
              echo "Backend ready after ${i}s"
              break
            fi
            echo "Waiting... (${i}s)"
            sleep 2
          done

      - name: Run integration tests
        if: steps.docs_check.outputs.skip != 'true'
        env:
          BASE_URL: http://localhost:8000
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          CI_POLL_TIMEOUT: 180
          CI_UPLOAD_TIMEOUT: 300
        run: python scripts/ci_integration_test.py
