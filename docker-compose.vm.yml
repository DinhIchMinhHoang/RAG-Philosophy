services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rag_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  backend:
    image: ghcr.io/dinhichminhhoang/rag-philosophy-backend:${IMAGE_TAG:-latest}
    container_name: rag_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      EMBEDDING_DEVICE: cpu
      WEB_CONCURRENCY: "1"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 3G
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/docs'); sys.exit(0)\"" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_db}" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app_net

  minio:
    image: minio/minio:RELEASE.2023-10-24T04-42-36Z
    container_name: rag_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app_net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G
    healthcheck:
      test: [ "CMD-SHELL", "/qdrant/qdrant --help > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
