<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Philosophy - Mesh Gradient Background</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <canvas id="gradientCanvas"></canvas>
    
    <header class="navbar" style="display: none;">
        <button class="brand-button">
            <img src="logo.svg" alt="Lumina Logo" class="navbar-logo">
            <span class="brand-text">LUMINA</span>
            <span class="brand-subtitle">notebook</span>
        </button>
        <div class="social-buttons">
            <button class="social-button" title="Instagram">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zM5.838 12a6.162 6.162 0 1 1 12.324 0 6.162 6.162 0 0 1-12.324 0zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm4.965-10.322a1.44 1.44 0 1 1 2.881.001 1.44 1.44 0 0 1-2.881-.001z"/>
                </svg>
            </button>
            <button class="social-button" title="Facebook">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>
            <button class="social-button account-button" data-scene="account" title="Account">
                <span class="material-icons">account_circle</span>
            </button>
        </div>
    </header>

    <!-- Landing Scene -->
    <div id="scene-landing" class="scene">
        <div class="text-container">
            <div class="logo-text-wrapper">
                <img src="logo.svg" alt="Lumina Logo" class="logo">
                <h1 class="lumina-text">LUMINA</h1>
            </div>
            <p class="notebook-text">notebook</p>
            <div class="button-container">
                <button class="auth-button" data-scene="signup">Sign Up</button>
                <button class="auth-button" data-scene="signin">Sign In</button>
            </div>
        </div>
    </div>
    
    <!-- Account Scene -->
    <div id="scene-account" class="scene" style="display: none;">
        <div class="form-container">
            <h2 class="form-title">Account</h2>
            <form class="account-form">
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">account_circle</span> Username</label>
                    <input id="account-username" type="text" class="form-input" placeholder="User name">
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">alternate_email</span> Email</label>
                    <input id="account-email" type="email" class="form-input" placeholder="Email">
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">person</span> Display name</label>
                    <input id="account-displayname" type="text" class="form-input" placeholder="Display name">
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">chat</span> Bio</label>
                    <textarea id="account-bio" class="form-input" placeholder="Short bio" rows="3"></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="auth-button">Save changes</button>
                    <button type="button" class="auth-button" data-back-to="dashboard">Cancel</button>
                </div>

                <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end;">
                    <button type="button" class="auth-button logout-button">Log out</button>
                    <button type="button" class="auth-button delete-account-button" style="background: rgba(255,50,50,0.12); border-color: rgba(255,50,50,0.2);">Delete account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sign Up Scene -->
    <div id="scene-signup" class="scene" style="display: none;">
        <div class="form-container">
            <h2 class="form-title">Create Account</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">account_circle</span> User name</label>
                    <input type="text" class="form-input" placeholder="User name" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">alternate_email</span> Email</label>
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">lock</span> Password</label>
                    <input type="password" class="form-input" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">lock</span> Confirm Password</label>
                    <input type="password" class="form-input" placeholder="Confirm Password" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="auth-button">Confirm</button>
                    <button type="button" class="auth-button" data-back-to="landing">Back</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sign In Scene -->
    <div id="scene-signin" class="scene" style="display: none;">
        <div class="form-container">
            <h2 class="form-title">Sign In</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">alternate_email</span> Email</label>
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span class="material-icons">lock</span> Password</label>
                    <input type="password" class="form-input" placeholder="Password" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="auth-button">Sign In</button>
                    <button type="button" class="auth-button" data-back-to="landing">Back</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard Scene (shown after login) -->
    <div id="scene-dashboard" class="scene" style="display: none;">
        <div class="dashboard-container">

            <div class="dashboard-top">
                <div class="left-controls">
                    <div class="sort-switch" role="tablist" aria-label="Sort notebooks">
                        <button class="sort-option active" data-sort="recent">
                            <span class="material-icons">history</span>
                            <span class="label">Recently</span>
                        </button>
                        <button class="sort-option" data-sort="alpha">
                            <span class="material-icons">sort_by_alpha</span>
                            <span class="label">A → Z</span>
                        </button>
                        <div class="sort-thumb" aria-hidden="true"></div>
                    </div>

                    <button class="auth-button create-button" title="Create new notebook">
                        <span class="material-icons">add</span>
                        Create new notebook
                    </button>
                </div>

                <div class="center-controls">
                    <div class="search-wrap">
                        <input type="text" class="search-input" placeholder="Search notebooks...">
                    </div>
                </div>

                <div class="right-controls">
                    <button class="social-button search-button" title="Search">
                        <span class="material-icons">search</span>
                    </button>

                    <div class="view-toggle" role="tablist" aria-label="View mode">
                        <button class="view-option" data-view="grid" title="Grid view">
                            <span class="material-icons">grid_view</span>
                            <span class="label">Grid</span>
                        </button>
                        <button class="view-option" data-view="list" title="List view">
                            <span class="material-icons">format_list_bulleted</span>
                            <span class="label">List</span>
                        </button>
                        <div class="view-thumb" aria-hidden="true"></div>
                    </div>
                </div>
            </div>

            <div class="sections">
                <div class="notebook-section community-section">
                    <div class="section-header">
                        <h3>Community notebooks:</h3>
                    </div>
                    <div class="notebook-grid community-grid" aria-live="polite">
                        <div class="notebook-item">Community A</div>
                        <div class="notebook-item">Community B</div>
                        <div class="notebook-item">Community C</div>
                        <div class="notebook-item">Community D</div>
                    </div>
                </div>

                <div class="notebook-section my-section">
                    <div class="section-header">
                        <h3>My notebooks:</h3>
                    </div>
                    <div class="notebook-grid my-grid" aria-live="polite">
                        <div class="notebook-item">My Notebook 1</div>
                        <div class="notebook-item">My Notebook 2</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="transitions.js"></script>
    <script src="script.js"></script>
</body>
</html>
