<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Philosophy - Lumina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gradientCanvas"></canvas>
    <div class="text-container">
        <div class="logo-text-wrapper">
            <img src="logo.svg" alt="Lumina Logo" class="logo">
            <h1 class="lumina-text">LUMINA</h1>
        </div>
        <p class="notebook-text">notebook</p>
        <div class="button-container">
            <button class="auth-button" id="btn-show-signup">Sign Up</button>   
            <button class="auth-button" id="btn-show-login">Login</button>      
        </div>
    </div>

    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Lumina</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <p id="error-message" class="error"></p>
                <button type="submit" class="auth-button submit-btn">Xác nhận</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="api.js"></script>
</body>
</html>
